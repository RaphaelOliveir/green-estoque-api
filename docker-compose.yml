version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: green_estoque_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-greenuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-greenpass}
      POSTGRES_DB: ${POSTGRES_DB:-green_estoque}
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-greenuser} -d ${POSTGRES_DB:-green_estoque}']
      interval: 10s
      timeout: 5s
      retries: 5

  postgres_test:
    image: postgres:16-alpine
    container_name: green_estoque_db_test
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-greenuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-greenpass}
      POSTGRES_DB: green_estoque_test
    ports:
      - '5433:5432'
    volumes:
      - postgres_test_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgres_data:
  postgres_test_data:
